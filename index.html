<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Hangul Sound Quiz (한국어 발음 훈련)</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --border: #334155;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
      --accent-hover: #0284c7;
      --success: #22c55e;
      --error: #ef4444;
      --card-hover: #283548;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
    }

    .container {
      width: 100%;
      max-width: 480px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 24px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.4);
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border);
      padding-bottom: 12px;
    }

    .progress-text {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--accent);
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    .score-badge {
      font-size: 0.85rem;
      background: var(--border);
      padding: 4px 10px;
      border-radius: 999px;
      font-weight: 600;
    }

    .card-display {
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 32px 16px;
      text-align: center;
      position: relative;
    }

    .hangul-target {
      font-size: 4.8rem;
      font-weight: 700;
      line-height: 1.1;
      letter-spacing: -0.02em;
      color: var(--text-main);
      margin-bottom: 12px;
    }

    .decomposition {
      font-size: 1rem;
      color: var(--text-muted);
      min-height: 24px;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 6px;
    }

    .decomposition span {
      background: var(--card-bg);
      padding: 2px 8px;
      border-radius: 6px;
      border: 1px solid var(--border);
      font-weight: 500;
    }

    .audio-btn {
      margin-top: 14px;
      background: transparent;
      border: 1px solid var(--border);
      color: var(--accent);
      border-radius: 999px;
      padding: 6px 14px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
    }

    .audio-btn:hover {
      background: rgba(56, 189, 248, 0.1);
      border-color: var(--accent);
    }

    .options-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .option-btn {
      background: rgba(30, 41, 59, 0.8);
      border: 1.5px solid var(--border);
      border-radius: 14px;
      padding: 16px 12px;
      color: var(--text-main);
      font-size: 1.15rem;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
      transition: all 0.15s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 64px;
    }

    .option-btn:hover:not(:disabled) {
      background: var(--card-hover);
      border-color: var(--accent);
      transform: translateY(-1px);
    }

    .option-btn:disabled {
      cursor: default;
    }

    .option-btn.correct {
      background: rgba(34, 197, 94, 0.15) !important;
      border-color: var(--success) !important;
      color: var(--success) !important;
    }

    .option-btn.wrong {
      background: rgba(239, 68, 68, 0.15) !important;
      border-color: var(--error) !important;
      color: var(--error) !important;
    }

    .feedback-area {
      min-height: 44px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .feedback-text {
      font-size: 0.9rem;
      font-weight: 500;
      color: var(--text-muted);
    }

    .next-btn {
      background: var(--accent);
      color: #0f172a;
      border: none;
      border-radius: 10px;
      padding: 10px 20px;
      font-weight: 700;
      font-size: 0.9rem;
      cursor: pointer;
      transition: background 0.2s;
    }

    .next-btn:hover {
      background: var(--accent-hover);
    }

    .hidden {
      display: none !important;
    }

    .summary-screen {
      text-align: center;
      padding: 24px 0;
    }

    .summary-title {
      font-size: 1.8rem;
      font-weight: 800;
      margin-bottom: 8px;
    }

    .final-score {
      font-size: 3.5rem;
      font-weight: 800;
      color: var(--accent);
      margin: 16px 0;
    }

    .summary-stats {
      color: var(--text-muted);
      font-size: 0.95rem;
      margin-bottom: 24px;
    }

    .restart-btn {
      width: 100%;
      background: var(--accent);
      color: #0f172a;
      border: none;
      padding: 14px;
      font-size: 1rem;
      font-weight: 700;
      border-radius: 12px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="container">
    <div id="quiz-ui">
      <header>
        <span class="progress-text" id="progress-indicator">Question 1 / 100</span>
        <span class="score-badge" id="score-indicator">Score: 0</span>
      </header>

      <main style="display:flex; flex-direction:column; gap:20px; margin-top:16px;">
        <div class="card-display">
          <div class="hangul-target" id="target-display">가</div>
          <div class="decomposition" id="decomp-display">
            <span>ㄱ</span><span>+</span><span>ㅏ</span>
          </div>
          <button class="audio-btn" id="listen-btn" title="Replay audio (Shortcut: R)">
            🔊 Pronounce
          </button>
        </div>

        <div class="options-grid" id="options-container"></div>

        <div class="feedback-area">
          <div class="feedback-text" id="feedback-message">Select the matching romanization</div>
          <button class="next-btn hidden" id="next-btn">Next →</button>
        </div>
      </main>
    </div>

    <div id="summary-ui" class="summary-screen hidden">
      <div class="summary-title">Quiz Completed!</div>
      <p class="summary-stats">Session performance evaluation</p>
      <div class="final-score" id="final-score-val">0 / 100</div>
      <p class="summary-stats" id="accuracy-rate">Accuracy: 0%</p>
      <button class="restart-btn" id="restart-btn">Start New Session</button>
    </div>
  </div>

  <script>
    // Audio synthesizer for immediate tactile auditory feedback
    const AudioEngine = {
      ctx: null,
      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (AudioContext) this.ctx = new AudioContext();
        }
      },
      playFeedback(isCorrect) {
        this.init();
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.connect(gain);
        gain.connect(this.ctx.destination);

        if (isCorrect) {
          osc.frequency.setValueAtTime(523.25, now); // C5
          osc.frequency.setValueAtTime(659.25, now + 0.08); // E5
          gain.gain.setValueAtTime(0.12, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);
          osc.start(now);
          osc.stop(now + 0.35);
        } else {
          osc.type = "sawtooth";
          osc.frequency.setValueAtTime(220, now);
          osc.frequency.setValueAtTime(196, now + 0.1);
          gain.gain.setValueAtTime(0.15, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
          osc.start(now);
          osc.stop(now + 0.3);
        }
      }
    };

    // Pronunciation engine via Web Speech API (ko-KR)
    function speakHangul(text) {
      if (!('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'ko-KR';
      utterance.rate = 0.85;
      window.speechSynthesis.speak(utterance);
    }

    // Dataset covering consonants, vowels, basic syllables, and batchim combinations
    const HANGUL_DATASET = [
      // Single Consonants
      { symbol: "ㄱ", roman: "g / k", decomp: ["Basic Consonant"] },
      { symbol: "ㄴ", roman: "n", decomp: ["Basic Consonant"] },
      { symbol: "ㄷ", roman: "d / t", decomp: ["Basic Consonant"] },
      { symbol: "ㄹ", roman: "r / l", decomp: ["Basic Consonant"] },
      { symbol: "ㅁ", roman: "m", decomp: ["Basic Consonant"] },
      { symbol: "ㅂ", roman: "b / p", decomp: ["Basic Consonant"] },
      { symbol: "ㅅ", roman: "s", decomp: ["Basic Consonant"] },
      { symbol: "ㅇ", roman: "ng (silent initial)", decomp: ["Consonant"] },
      { symbol: "ㅈ", roman: "j", decomp: ["Basic Consonant"] },
      { symbol: "ㅊ", roman: "ch", decomp: ["Aspirated Consonant"] },
      { symbol: "ㅋ", roman: "k", decomp: ["Aspirated Consonant"] },
      { symbol: "ㅌ", roman: "t", decomp: ["Aspirated Consonant"] },
      { symbol: "ㅍ", roman: "p", decomp: ["Aspirated Consonant"] },
      { symbol: "ㅎ", roman: "h", decomp: ["Aspirated Consonant"] },
      { symbol: "ㄲ", roman: "kk", decomp: ["Tense Consonant"] },
      { symbol: "ㄸ", roman: "tt", decomp: ["Tense Consonant"] },
      { symbol: "ㅃ", roman: "pp", decomp: ["Tense Consonant"] },
      { symbol: "ㅆ", roman: "ss", decomp: ["Tense Consonant"] },
      { symbol: "ㅉ", roman: "jj", decomp: ["Tense Consonant"] },

      // Single Vowels & Diphthongs
      { symbol: "ㅏ", roman: "a", decomp: ["Vowel"] },
      { symbol: "ㅑ", roman: "ya", decomp: ["Iotized Vowel"] },
      { symbol: "ㅓ", roman: "eo", decomp: ["Open Vowel"] },
      { symbol: "ㅕ", roman: "yeo", decomp: ["Iotized Vowel"] },
      { symbol: "ㅗ", roman: "o", decomp: ["Vowel"] },
      { symbol: "ㅛ", roman: "yo", decomp: ["Iotized Vowel"] },
      { symbol: "ㅜ", roman: "u", decomp: ["Vowel"] },
      { symbol: "ㅠ", roman: "yu", decomp: ["Iotized Vowel"] },
      { symbol: "ㅡ", roman: "eu", decomp: ["Close Flat Vowel"] },
      { symbol: "ㅣ", roman: "i", decomp: ["Front Vowel"] },
      { symbol: "ㅐ", roman: "ae", decomp: ["Diphthong"] },
      { symbol: "ㅔ", roman: "e", decomp: ["Diphthong"] },
      { symbol: "ㅘ", roman: "wa", decomp: ["ㅗ + ㅏ"] },
      { symbol: "ㅝ", roman: "wo", decomp: ["ㅜ + ㅓ"] },
      { symbol: "ㅢ", roman: "ui", decomp: ["ㅡ + ㅣ"] },

      // Syllables: CV
      { symbol: "가", roman: "ga", decomp: ["ㄱ", "ㅏ"] },
      { symbol: "나", roman: "na", decomp: ["ㄴ", "ㅏ"] },
      { symbol: "다", roman: "da", decomp: ["ㄷ", "ㅏ"] },
      { symbol: "라", roman: "ra", decomp: ["ㄹ", "ㅏ"] },
      { symbol: "마", roman: "ma", decomp: ["ㅁ", "ㅏ"] },
      { symbol: "바", roman: "ba", decomp: ["ㅂ", "ㅏ"] },
      { symbol: "사", roman: "sa", decomp: ["ㅅ", "ㅏ"] },
      { symbol: "아", roman: "a", decomp: ["ㅇ", "ㅏ"] },
      { symbol: "자", roman: "ja", decomp: ["ㅈ", "ㅏ"] },
      { symbol: "하", roman: "ha", decomp: ["ㅎ", "ㅏ"] },
      { symbol: "구", roman: "gu", decomp: ["ㄱ", "ㅜ"] },
      { symbol: "누", roman: "nu", decomp: ["ㄴ", "ㅜ"] },
      { symbol: "두", roman: "du", decomp: ["ㄷ", "ㅜ"] },
      { symbol: "루", roman: "ru", decomp: ["ㄹ", "ㅜ"] },
      { symbol: "무", roman: "mu", decomp: ["ㅁ", "ㅜ"] },
      { symbol: "부", roman: "bu", decomp: ["ㅂ", "ㅜ"] },
      { symbol: "수", roman: "su", decomp: ["ㅅ", "ㅜ"] },
      { symbol: "우", roman: "u", decomp: ["ㅇ", "ㅜ"] },
      { symbol: "주", roman: "ju", decomp: ["ㅈ", "ㅜ"] },
      { symbol: "호", roman: "ho", decomp: ["ㅎ", "ㅗ"] },
      { symbol: "고", roman: "go", decomp: ["ㄱ", "ㅗ"] },
      { symbol: "노", roman: "no", decomp: ["ㄴ", "ㅗ"] },
      { symbol: "도", roman: "do", decomp: ["ㄷ", "ㅗ"] },
      { symbol: "로", roman: "ro", decomp: ["ㄹ", "ㅗ"] },
      { symbol: "모", roman: "mo", decomp: ["ㅁ", "ㅗ"] },
      { symbol: "보", roman: "bo", decomp: ["ㅂ", "ㅗ"] },
      { symbol: "소", roman: "so", decomp: ["ㅅ", "ㅗ"] },
      { symbol: "오", roman: "o", decomp: ["ㅇ", "ㅗ"] },
      { symbol: "기", roman: "gi", decomp: ["ㄱ", "ㅣ"] },
      { symbol: "니", roman: "ni", decomp: ["ㄴ", "ㅣ"] },
      { symbol: "디", roman: "di", decomp: ["ㄷ", "ㅣ"] },
      { symbol: "리", roman: "ri", decomp: ["ㄹ", "ㅣ"] },
      { symbol: "미", roman: "mi", decomp: ["ㅁ", "ㅣ"] },
      { symbol: "비", roman: "bi", decomp: ["ㅂ", "ㅣ"] },
      { symbol: "시", roman: "si", decomp: ["ㅅ", "ㅣ"] },
      { symbol: "이", roman: "i", decomp: ["ㅇ", "ㅣ"] },
      { symbol: "지", roman: "ji", decomp: ["ㅈ", "ㅣ"] },

      // Syllables with Batchim (CVC)
      { symbol: "산", roman: "san", decomp: ["ㅅ", "ㅏ", "ㄴ"] },
      { symbol: "달", roman: "dal", decomp: ["ㄷ", "ㅏ", "ㄹ"] },
      { symbol: "물", roman: "mul", decomp: ["ㅁ", "ㅜ", "ㄹ"] },
      { symbol: "밥", roman: "bap", decomp: ["ㅂ", "ㅏ", "ㅂ"] },
      { symbol: "집", roman: "jip", decomp: ["ㅈ", "ㅣ", "ㅂ"] },
      { symbol: "눈", roman: "nun", decomp: ["ㄴ", "ㅜ", "ㄴ"] },
      { symbol: "문", roman: "mun", decomp: ["ㅁ", "ㅜ", "ㄴ"] },
      { symbol: "손", roman: "son", decomp: ["ㅅ", "ㅗ", "ㄴ"] },
      { symbol: "발", roman: "bal", decomp: ["ㅂ", "ㅏ", "ㄹ"] },
      { symbol: "강", roman: "gang", decomp: ["ㄱ", "ㅏ", "ㅇ"] },
      { symbol: "방", roman: "bang", decomp: ["ㅂ", "ㅏ", "ㅇ"] },
      { symbol: "봄", roman: "bom", decomp: ["ㅂ", "ㅗ", "ㅁ"] },
      { symbol: "밤", roman: "bam", decomp: ["ㅂ", "ㅏ", "ㅁ"] },
      { symbol: "국", roman: "guk", decomp: ["ㄱ", "ㅜ", "ㄱ"] },
      { symbol: "책", roman: "chaek", decomp: ["ㅊ", "ㅐ", "ㄱ"] },
      { symbol: "꽃", roman: "kkot", decomp: ["ㄲ", "ㅗ", "ㅊ"] },
      { symbol: "빛", roman: "bit", decomp: ["ㅂ", "ㅣ", "ㅊ"] },
      { symbol: "길", roman: "gil", decomp: ["ㄱ", "ㅣ", "ㄹ"] }
    ];

    let sessionPool = [];
    let currentIndex = 0;
    let score = 0;
    let isAnswered = false;
    const TOTAL_QUESTIONS = 100;

    function shuffleArray(array) {
      const arr = [...array];
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    function buildQuizSession() {
      sessionPool = [];
      while (sessionPool.length < TOTAL_QUESTIONS) {
        const shuffled = shuffleArray(HANGUL_DATASET);
        sessionPool.push(...shuffled);
      }
      sessionPool = sessionPool.slice(0, TOTAL_QUESTIONS);
      currentIndex = 0;
      score = 0;
      isAnswered = false;
    }

    function generateOptions(correctItem) {
      const wrongPool = HANGUL_DATASET
        .filter(item => item.roman !== correctItem.roman)
        .map(item => item.roman);

      const uniqueWrong = Array.from(new Set(wrongPool));
      const shuffledWrong = shuffleArray(uniqueWrong).slice(0, 3);
      const combined = shuffleArray([correctItem.roman, ...shuffledWrong]);
      return combined;
    }

    function renderQuestion() {
      isAnswered = false;
      const current = sessionPool[currentIndex];

      document.getElementById('progress-indicator').textContent = `Question ${currentIndex + 1} / ${TOTAL_QUESTIONS}`;
      document.getElementById('score-indicator').textContent = `Score: ${score}`;
      document.getElementById('target-display').textContent = current.symbol;

      const decompContainer = document.getElementById('decomp-display');
      decompContainer.innerHTML = '';
      current.decomp.forEach((char, idx) => {
        const span = document.createElement('span');
        span.textContent = char;
        decompContainer.appendChild(span);
        if (idx < current.decomp.length - 1 && current.decomp.length > 1) {
          const plus = document.createElement('span');
          plus.textContent = '+';
          plus.style.border = 'none';
          plus.style.background = 'transparent';
          decompContainer.appendChild(plus);
        }
      });

      const options = generateOptions(current);
      const optionsContainer = document.getElementById('options-container');
      optionsContainer.innerHTML = '';

      options.forEach(opt => {
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.textContent = opt;
        btn.onclick = () => handleSelection(btn, opt, current.roman);
        optionsContainer.appendChild(btn);
      });

      document.getElementById('feedback-message').textContent = 'Select the matching pronunciation';
      document.getElementById('feedback-message').style.color = 'var(--text-muted)';
      document.getElementById('next-btn').classList.add('hidden');

      // Auto-pronounce when entering question
      speakHangul(current.symbol);
    }

    function handleSelection(selectedBtn, selectedVal, correctVal) {
      if (isAnswered) return;
      isAnswered = true;

      const allBtns = document.querySelectorAll('.option-btn');
      allBtns.forEach(b => b.disabled = true);

      const isCorrect = (selectedVal === correctVal);
      AudioEngine.playFeedback(isCorrect);

      if (isCorrect) {
        score++;
        selectedBtn.classList.add('correct');
        document.getElementById('feedback-message').textContent = '✓ Correct';
        document.getElementById('feedback-message').style.color = 'var(--success)';
      } else {
        selectedBtn.classList.add('wrong');
        allBtns.forEach(b => {
          if (b.textContent === correctVal) b.classList.add('correct');
        });
        document.getElementById('feedback-message').textContent = `✕ Expected: ${correctVal}`;
        document.getElementById('feedback-message').style.color = 'var(--error)';
      }

      document.getElementById('score-indicator').textContent = `Score: ${score}`;
      document.getElementById('next-btn').classList.remove('hidden');
    }

    function advanceNext() {
      if (currentIndex < TOTAL_QUESTIONS - 1) {
        currentIndex++;
        renderQuestion();
      } else {
        showSummary();
      }
    }

    function showSummary() {
      document.getElementById('quiz-ui').classList.add('hidden');
      const summary = document.getElementById('summary-ui');
      summary.classList.remove('hidden');

      document.getElementById('final-score-val').textContent = `${score} / ${TOTAL_QUESTIONS}`;
      const acc = Math.round((score / TOTAL_QUESTIONS) * 100);
      document.getElementById('accuracy-rate').textContent = `Accuracy: ${acc}%`;
    }

    // Event Bindings
    document.getElementById('listen-btn').onclick = () => {
      speakHangul(sessionPool[currentIndex].symbol);
    };

    document.getElementById('next-btn').onclick = advanceNext;

    document.getElementById('restart-btn').onclick = () => {
      document.getElementById('summary-ui').classList.add('hidden');
      document.getElementById('quiz-ui').classList.remove('hidden');
      buildQuizSession();
      renderQuestion();
    };

    // Keyboard Shortcuts (1-4 for options, Enter/Space for next, R for replay)
    window.addEventListener('keydown', (e) => {
      if (e.key === 'r' || e.key === 'R') {
        speakHangul(sessionPool[currentIndex].symbol);
      } else if (['1', '2', '3', '4'].includes(e.key) && !isAnswered) {
        const btns = document.querySelectorAll('.option-btn');
        const idx = parseInt(e.key, 10) - 1;
        if (btns[idx]) btns[idx].click();
      } else if ((e.key === 'Enter' || e.key === ' ') && isAnswered) {
        e.preventDefault();
        advanceNext();
      }
    });

    // Start Session on load
    buildQuizSession();
    renderQuestion();
  </script>
</body>
</html>
